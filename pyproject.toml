[project]
name = "ga4-toolkit"
version = "0.1.0"
description = "Portable GA4 Data API toolkit — Python CLI + MCP server. Read-only, service-account auth."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Square360", email = "webmaster@square360.com" },
]
keywords = ["ga4", "google-analytics", "analytics", "mcp", "drupal"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

dependencies = [
    "google-analytics-data>=0.18.0",
    "google-auth>=2.28.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
ga4 = "ga4_toolkit.cli:app"
ga4-mcp = "ga4_toolkit.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Square360/s360-ga4-toolkit"
Repository = "https://github.com/Square360/s360-ga4-toolkit"
Issues = "https://github.com/Square360/s360-ga4-toolkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
